name: ivas
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${IVAS_DB_NAME:-ivas}
      POSTGRES_USER: ${IVAS_DB_USER:-ivas}
      POSTGRES_PASSWORD: ${IVAS_DB_PASSWORD:-ivas-local}
    ports:
      - "127.0.0.1:${IVAS_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
