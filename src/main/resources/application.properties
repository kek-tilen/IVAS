spring.application.name=project

# Naloga 4: disabled until the owner explicitly configures the Azure deployment.
ivas.azure-openai.enabled=${IVAS_AI_ENABLED:false}
ivas.azure-openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
ivas.azure-openai.api-key=${AZURE_OPENAI_API_KEY:}
ivas.azure-openai.deployment=${AZURE_OPENAI_DEPLOYMENT:}
ivas.azure-openai.timeout-seconds=${IVAS_AI_TIMEOUT_SECONDS:60}
ivas.azure-openai.max-completion-tokens=${IVAS_AI_MAX_COMPLETION_TOKENS:4096}

# Naloga 5: loopback-only plaintext gRPC, not a public production endpoint.
ivas.grpc.port=${IVAS_GRPC_PORT:50051}
# Empty uses Playwright Chromium; msedge/chrome uses an installed browser.
ivas.ares.browser-channel=${IVAS_ARES_BROWSER_CHANNEL:}
