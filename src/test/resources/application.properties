# Offline, test-only database. The same Flyway migrations and schema validation run.
# Override to run the suite against a dedicated PostgreSQL test database.
spring.datasource.url=${IVAS_TEST_DB_URL:jdbc:h2:mem:ivas-tests;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${IVAS_TEST_DB_USER:sa}
spring.datasource.password=${IVAS_TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
